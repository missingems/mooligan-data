name: Lore sources

# Scrapes the story from before Magic Story: card flavor text (Scryfall), wizards.com's old story columns
# (the Internet Archive) and MTG Wiki. Each source runs as its own job and commits its folder under lore/data.
# See lore/mtglore/sources.py.
on:
  workflow_dispatch:
  push:
    branches: [claude/lucid-allen-jjvx9l]
    paths: [lore/sources.json]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    # One run per source at a time; a new run of one source doesn't wait on the others.
    concurrency:
      group: lore-sources-${{ matrix.source }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        source: [cards, archive, wiki, scryfall]
    defaults:
      run:
        working-directory: lore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lore/requirements.txt
      - run: pip install -r requirements.txt
      - name: Scrape ${{ matrix.source }}
        env:
          LORE_DELAY: "1.0"
          # The Archive is slow: stop in time for the commit below, and let the next run carry on.
          LORE_ARCHIVE_MINUTES: "300"
        run: |
          # sources.json can name the sources to run ("only"); without it, all of them run.
          if jq -e --arg s "${{ matrix.source }}" '(.only // null) != null and (.only | index($s) | not)' sources.json > /dev/null; then
            echo "Skipping ${{ matrix.source }}: not in sources.json's only"; exit 0
          fi
          python -m mtglore scrape-${{ matrix.source }}
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          bash commit.sh "Lore - scrape ${{ matrix.source }}"
