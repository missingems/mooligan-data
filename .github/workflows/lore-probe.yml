name: Lore probe

# Temporary (round 2): saves a few pages of the story site so the parser can be written against real HTML.
on:
  push:
    branches: [claude/lucid-allen-jjvx9l]
    paths: [.github/workflows/lore-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        run: |
          mkdir -p lore/probe
          ua="mooligan-lore/0.1 (+https://data.mooligan.com)"
          get() { curl -sSL -A "$ua" -o "lore/probe/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" || echo "$1 failed"; }
          get page2.html "https://magic.wizards.com/en/news/magic-story?page=2"
          get article-new.html https://magic.wizards.com/en/news/magic-story/reality-fracture-episode-1-tam-alive
          get article-old.html https://magic.wizards.com/en/news/magic-story/zendikars-last-stand-2016-02-17
          get jace.html https://magic.wizards.com/en/story/jace-beleren-planeswalker
          get zendikar.html https://magic.wizards.com/en/story/zendikar-plane
          get old-archive.html https://magic.wizards.com/en/articles/archive/magic-story/zendikars-last-stand-2016-02-17
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lore/probe
          git commit -m "Lore probe: sample pages from the story site" && git push || echo "nothing to commit"
