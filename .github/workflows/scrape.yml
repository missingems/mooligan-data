name: Scrape mtgo.com and MTGTop8

# Downloads the published snapshots from R2, scrapes what is new, and uploads the result. See docs/data-format.md for
# the files. Each format is a job of its own, one after another, so a format that fails only loses its own day: the
# others still publish, and it keeps its previous snapshot. The files built from every format (index.json,
# explore.json, today.json, the card pages, EDHREC, the guides...) are built once, by a last job, from whatever the
# format jobs published. Every job is ops/scrape.sh, which also runs on a Mac for development (see the README,
# "Running locally").
on:
  schedule:
    # Once a day, after the card catalog's 10:17 build, so the price movers read that day's prices.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      formats:
        description: Formats to scrape, one job each; the files built from every format are built either way
        default: modern,standard,pioneer,legacy,pauper,vintage,premodern,duel_commander
      fresh:
        description: Start the scrape from nothing, ignoring the stored snapshots and state of these formats (nothing in R2 is deleted)
        type: boolean
        default: false
      minutes:
        description: Minutes of requests per format job (empty means 90)
        default: ""

# Two runs must never publish over each other.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  # The format jobs, from the formats input (empty on a scheduled run, which means all eight).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      formats: ${{ steps.plan.outputs.formats }}
    steps:
      - id: plan
        env:
          FORMATS: ${{ inputs.formats }}
        run: |
          formats=$(jq -cn --arg wanted "${FORMATS:-modern,standard,pioneer,legacy,pauper,vintage,premodern,duel_commander}" '
            [$wanted | split(",")[] | gsub("^\\s+|\\s+$"; "") | select(length > 0)]
            | to_entries
            | map({format: .value, fresh: (if .key == 0 then "1" else "formats" end)})
          ')
          echo "formats=$formats" >> "$GITHUB_OUTPUT"
          echo "$formats" | jq .

  scrape:
    needs: plan
    name: scrape ${{ matrix.format }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      # One format at a time, so mtgo.com and MTGTop8 are only ever asked for one page at a time; a format that fails
      # does not stop the ones after it.
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.formats) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scraper/requirements.txt
            ops/requirements.txt
      - name: Scrape ${{ matrix.format }} and upload it
        run: ops/scrape.sh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The script publishes nothing unless told to, so a local run never does by accident.
          PUBLISH: "1"
          SYNC: r2
          FORMATS: ${{ matrix.format }}
          # This format's files and the state; the files built from every format are the shared job's.
          SHARED: "0"
          # Empty on a scheduled run, which means the script's default.
          SCRAPE_MINUTES: ${{ inputs.minutes }}
          # The first format ignores everything stored by the scrape, the others only their own, so the ids every
          # format shares are cleared once.
          FRESH: ${{ inputs.fresh && matrix.fresh || '0' }}
          # setup-python's interpreter, which the script builds scraper/.venv from.
          PYTHON: python

  shared:
    needs: [plan, scrape]
    # After the format jobs whether they passed or not, since a format that failed keeps its previous snapshot and
    # the files are built from it. Not after the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # EDHREC and the card pages take about 30 minutes, the bracket rankings, commander guides and their polish 20,
    # and the upload 13.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scraper/requirements.txt
            ops/requirements.txt
      - name: Build the files from every format and upload them
        run: ops/scrape.sh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Claude polishes the commander guides' summaries (one Message Batch a run) and tags premier events with their
          # formats (premier/schedule.json). Without the secret the guides keep their templated summaries and the events
          # only the formats their type and name give; the workspace id is only for a key not scoped to one workspace.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          PUBLISH: "1"
          SYNC: r2
          # Nothing is read from mtgo.com or MTGTop8: every format's stored snapshot, as the format jobs left it.
          SCRAPE: "0"
          PYTHON: python
