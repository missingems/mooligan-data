name: Scrape MTGGoldfish

# Downloads the published snapshots from R2, scrapes what is new, and uploads
# the result. See docs/data-format.md for the files. The whole job is ops/scrape.sh,
# which also runs on a Mac for development (see the README, "Running locally").
on:
  schedule:
    # Once a day, after the card catalog's 10:17 build, so the price movers read that day's prices.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      formats:
        description: Formats to scrape
        default: modern,standard,pioneer,legacy,pauper,vintage,premodern,penny_dreadful,duel_commander
      max_new_decks:
        description: New decklists per format per run
        default: "1500"

# Two runs must never publish over each other.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scraper/requirements.txt
            ops/requirements.txt
      # The runner image ships Google Chrome; UC mode runs it headed inside Xvfb.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Scrape and upload
        run: ops/scrape.sh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The script publishes nothing unless told to, so a local run never does by accident.
          PUBLISH: "1"
          SYNC: r2
          # Empty on a scheduled run, which means the script's defaults.
          FORMATS: ${{ inputs.formats }}
          MAX_NEW_DECKS: ${{ inputs.max_new_decks }}
          # setup-python's interpreter, which the script builds scraper/.venv from.
          PYTHON: python
